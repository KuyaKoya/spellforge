name: spellforge
description: "A text-based turn-based roguelike where a player controls a mage, casts spells, and progresses through nodes."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.21.0
  flutter_soloud: ^3.4.8
  shared_preferences: ^2.3.4
  collection: ^1.18.0
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/spellforge_logo.png
    - assets/enemy_sprites/
    - assets/audio/sound_effects/
    - assets/audio/music/
